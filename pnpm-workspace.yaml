packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@types/node@24.13.4'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - zod@4.6.1
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.272'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.272'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.272'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.272'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.272'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.272'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.272'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.272'
  - '@anthropic-ai/claude-agent-sdk@0.3.272'
