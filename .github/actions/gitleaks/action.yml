name: Verified Gitleaks
description: Install the checksum-pinned Linux x64 scanner for trusted source and script checks
runs:
  using: composite
  steps:
    - name: Install checksum-pinned Gitleaks 8.30.1
      shell: bash
      run: |
        if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
          echo 'The verified scanner installer requires Linux x64.' >&2
          exit 1
        fi
        scannerArchive="$RUNNER_TEMP/pact-gitleaks.tar.gz"
        trap 'rm -f -- "$scannerArchive"' EXIT
        curl --fail --silent --show-error --location --max-time 60 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$scannerArchive"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scannerArchive" | sha256sum --check
        install -d -m 700 "$RUNNER_TEMP/pact-gitleaks"
        tar -xzf "$scannerArchive" -C "$RUNNER_TEMP/pact-gitleaks" gitleaks
        echo "$RUNNER_TEMP/pact-gitleaks" >> "$GITHUB_PATH"
        echo "PACT_GITLEAKS_EXECUTABLE=$RUNNER_TEMP/pact-gitleaks/gitleaks" >> "$GITHUB_ENV"
