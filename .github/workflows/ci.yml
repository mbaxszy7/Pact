name: Pact CI - Code quality and app tests

on:
  push:
    branches: ['**']
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      extended_e2e:
        description: Run extended UI and deterministic regression
        type: boolean
        default: false
      validate_installers:
        description: Validate Dev and Stable native installers before enabling automatic packaging
        type: boolean
        default: false

# The authenticated controller source controls PR jobs. Frozen bootstrap execution
# stays disabled until its public identity tuple and separate environments are set.
# Uncredentialed jobs are read-only; model credentials and the App identity remain
# in separate admitted jobs and named environments.
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

env:
  PACT_CI_BOOTSTRAP_REF: ${{ vars.PACT_CI_BOOTSTRAP_REF }}
  PACT_CI_BOOTSTRAP_HEAD: ${{ vars.PACT_CI_BOOTSTRAP_HEAD }}
  PACT_CI_BOOTSTRAP_BASE: ${{ vars.PACT_CI_BOOTSTRAP_BASE }}
  PACT_CI_BOOTSTRAP_TREE: ${{ vars.PACT_CI_BOOTSTRAP_TREE }}
  PACT_CI_BOOTSTRAP_PR: ${{ vars.PACT_CI_BOOTSTRAP_PR }}

concurrency:
  group: pact-ci-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == vars.PACT_CI_BOOTSTRAP_REF && github.sha == vars.PACT_CI_BOOTSTRAP_HEAD && vars.PACT_CI_BOOTSTRAP_PR != '') && format('pr-{0}', vars.PACT_CI_BOOTSTRAP_PR) || format('branch-{0}', github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  identity:
    name: Resolve tested code
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.identity-artifact.outputs.artifact-id }}
      candidate: ${{ steps.identity.outputs.candidate }}
      head: ${{ steps.identity.outputs.head }}
      base: ${{ steps.identity.outputs.base }}
      tree: ${{ steps.identity.outputs.tree }}
      policy: ${{ steps.identity.outputs.policy }}
      channel: ${{ steps.identity.outputs.channel }}
      controller: ${{ steps.identity.outputs.controller }}
      source_kind: ${{ steps.identity.outputs.source_kind }}
      pull_request: ${{ steps.identity.outputs.pull_request }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - id: identity
        name: Capture current head, base, merged code tree and actual execution commit
        run: node scripts/ci-identity.mjs capture-api "$RUNNER_TEMP/ci-identity.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACT_CI_PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == vars.PACT_CI_BOOTSTRAP_REF && github.sha == vars.PACT_CI_BOOTSTRAP_HEAD && vars.PACT_CI_BOOTSTRAP_PR != '') && vars.PACT_CI_BOOTSTRAP_PR || '' }}
          PACT_CI_CONTROL_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          PACT_CI_PUSH_SHA: ${{ github.sha }}
          PACT_RELEASE_APP_BOT_ID: ${{ vars.PACT_RELEASE_APP_BOT_ID }}
          PACT_RELEASE_APP_SLUG: ${{ vars.PACT_RELEASE_APP_SLUG }}
      - id: identity-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-identity-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-identity.json
          if-no-files-found: error
          retention-days: 14
      - name: Record required and deferred CI platforms
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Required CI platforms: Windows x64 and macOS arm64.

          All Windows ARM64 CI is explicitly deferred by the owner. Its cold native
          launcher exceeded the unchanged 15-second startup budget; it is not a pass.
          Re-enable its native and Provider jobs together after resolving that failure
          and obtaining native-machine acceptance. Native installer validation can be
          dispatched before the packaging switch is enabled; publication keeps its
          separate owner-approved release gates.
          EOF

  publication:
    # Required by main protection; keep this exact check name.
    name: publication
    needs: identity
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: control/.node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
          run_install: false
      - name: Install only pinned controller dependencies without candidate execution
        working-directory: control
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./control/.github/actions/gitleaks
      - name: Review publication and all reachable source history
        working-directory: source
        run: |
          node ../control/scripts/check-publication.mjs
          node ../control/scripts/check-secrets.mjs --history
          node ../control/scripts/check-e2e-coverage.mjs --source-only --json
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source

  candidate-attestation:
    name: Verify PR code identity
    needs: identity
    if: github.repository_id == '1416403312' && ((github.event_name == 'pull_request_target' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == vars.PACT_CI_BOOTSTRAP_REF && github.sha == vars.PACT_CI_BOOTSTRAP_HEAD && vars.PACT_CI_BOOTSTRAP_PR != ''))
    environment: ${{ github.event_name == 'pull_request_target' && 'pact-control-plane' || 'pact-bootstrap-control-plane' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Only the authenticated controller source enters this job; no merge
      # candidate dependencies or model configuration are installed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-identity-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/pact-identity
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PACT_CI_APP_ID }}
          private-key: ${{ secrets.PACT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Pact
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: write
      - name: Bind trusted job outputs to a fixed-App candidate receipt
        run: >-
          node scripts/ci-control.mjs attest
          --identity "$RUNNER_TEMP/pact-identity/ci-identity.json" --run "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PACT_CI_APP_ID: ${{ secrets.PACT_CI_APP_ID }}
          PACT_CI_PR_NUMBER: ${{ needs.identity.outputs.pull_request }}
          PACT_CI_HEAD_SHA: ${{ needs.identity.outputs.head }}
          PACT_CI_BASE_SHA: ${{ needs.identity.outputs.base }}
          PACT_CI_CANDIDATE_SHA: ${{ needs.identity.outputs.candidate }}
          PACT_CI_TREE_SHA: ${{ needs.identity.outputs.tree }}
          PACT_CI_POLICY_SHA: ${{ needs.identity.outputs.policy }}
          PACT_CI_CHANNEL: ${{ needs.identity.outputs.channel }}

  quality:
    # Required by main protection; keep this exact check name.
    name: quality
    needs: [identity, publication]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          path: source
          persist-credentials: false
          fetch-depth: 2
      - uses: ./control/.github/actions/setup
        with:
          workspace: source
          controller: control
      - uses: ./control/.github/actions/gitleaks
      - name: All static checks, product/test types and unit cases
        run: node control/scripts/ci.mjs quality
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
      - name: Every independent script test
        run: node control/scripts/ci.mjs infra
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          PACT_CI_EVIDENCE_DIR: ${{ runner.temp }}/pact-quality-evidence
      - name: Preserve bounded script supervision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-process-evidence-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/pact-quality-evidence/infra-supervision.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build and immutable source assertion obligations
        working-directory: source
        run: |
          node ../control/scripts/ci.mjs build
          node ../control/scripts/check-e2e-coverage.mjs --json
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source

  platform:
    name: ${{ matrix.label }} - Native checks and E2E reports
    # No-credential native validation can diagnose platform/package failures while
    # shared quality runs independently. Provider admission and final gates require both.
    needs: [identity, publication]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            label: macOS arm64
            key: darwin-arm64
            package: true
          - runner: windows-2025
            platform: win32
            arch: x64
            label: Windows x64
            key: win32-x64
            package: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          path: source
          persist-credentials: false
          fetch-depth: 2
      - uses: ./control/.github/actions/setup
        with:
          workspace: source
          controller: control
          native: 'true'
          display: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.identity.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pact-identity
      - name: Verify target architecture and exact tested workspace
        run: |
          node --input-type=module -e 'if(process.platform!==process.env.TARGET_PLATFORM||process.arch!==process.env.TARGET_ARCH)throw Error("Runner architecture mismatch")'
          node control/scripts/ci-identity.mjs verify "$RUNNER_TEMP/pact-identity/ci-identity.json"
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          GITHUB_TOKEN: ${{ github.token }}
      - name: Rebuild desktop native dependencies for this architecture
        id: build
        run: node control/scripts/ci.mjs build
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
      - name: Native Windows process and installed-content regressions
        if: runner.os == 'Windows'
        working-directory: source
        run: |
          node --test --test-concurrency=1 scripts/run-e2e-windows.test.mjs scripts/run-e2e.test.mjs scripts/package-smoke.test.mjs
          pnpm exec vitest run tests/e2e/windows-cli-launcher.test.ts
      - name: Capture trusted no-credential case inventory for complete failure reports
        working-directory: control
        run: pnpm exec playwright test --list --reporter=json > "$RUNNER_TEMP/pact-e2e-inventory.json"
      - name: Extended Electron UI regression
        id: ui
        if: ${{ needs.identity.outputs.channel == 'stable' || inputs.extended_e2e == true }}
        run: node control/scripts/ci.mjs ui
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          PACT_CI_EVIDENCE_DIR: ${{ runner.temp }}/pact-evidence/${{ matrix.key }}
      - name: Extended deterministic business and lifecycle regression
        id: deterministic
        # Stable candidates always select full regression. Dev selects it only
        # explicitly; a completed failing UI lane still permits deterministic evidence.
        if: ${{ !cancelled() && (needs.identity.outputs.channel == 'stable' || inputs.extended_e2e == true) && steps.ui.outputs.ui_execution_completed == 'true' }}
        run: node control/scripts/ci.mjs deterministic
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          PACT_CI_EVIDENCE_DIR: ${{ runner.temp }}/pact-evidence/${{ matrix.key }}
      - name: Collect bounded no-credential Electron failure diagnostics
        if: failure()
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/pact-ui-diagnostics"
          node control/scripts/ci-ui-diagnostics.mjs --evidence "$RUNNER_TEMP/pact-evidence/$PLATFORM_KEY" --output "$RUNNER_TEMP/pact-ui-diagnostics/$PLATFORM_KEY"
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PACT_CI_DIAGNOSTIC_LANE: uncredentialed
      - name: Preserve only collected no-credential UI context and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-diagnostics-${{ matrix.key }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/pact-ui-diagnostics/${{ matrix.key }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize every no-credential case including failures and unexecuted journeys
        if: always()
        run: >-
          node control/scripts/ci-ui-diagnostics.mjs --reports
          --evidence "$RUNNER_TEMP/pact-evidence/$PLATFORM_KEY"
          --workspace "$GITHUB_WORKSPACE/source"
          --identity "$RUNNER_TEMP/pact-identity/ci-identity.json"
          --inventory "$RUNNER_TEMP/pact-e2e-inventory.json"
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PACT_CI_DIAGNOSTIC_LANE: uncredentialed
          PACT_UI_EXECUTION_COMPLETED: ${{ steps.ui.outputs.ui_execution_completed }}
          PACT_DETERMINISTIC_EXECUTION_COMPLETED: ${{ steps.deterministic.outputs.deterministic_execution_completed }}
          PACT_E2E_REPORT_SCOPE: ${{ (needs.identity.outputs.channel == 'stable' || inputs.extended_e2e == true) && 'full' || 'core' }}
      - name: Preserve actual uncredentialed test results and readable failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.key }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-evidence/${{ matrix.key }}/*.json
            ${{ runner.temp }}/pact-evidence/${{ matrix.key }}/*.md
          if-no-files-found: error
          retention-days: 14
      - name: Actual native CLI protocol, configuration and cold-history regression
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node control/scripts/ci.mjs native
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-evidence/${{ matrix.key }}
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/pact-identity/ci-identity.json
          PACT_CI_NATIVE_ARTIFACT: native-e2e-${{ matrix.key }}-a${{ github.run_attempt }}
      - name: Report native setup failures and unexecuted cases without replacing actual evidence
        if: always()
        run: node control/scripts/ci-native-report.mjs
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-evidence/${{ matrix.key }}
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/pact-identity/ci-identity.json
          PACT_CI_NATIVE_ARTIFACT: native-e2e-${{ matrix.key }}-a${{ github.run_attempt }}
      - name: Preserve safe native protocol case reports including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-e2e-${{ matrix.key }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-native-evidence/${{ matrix.key }}/native-summary.json
            ${{ runner.temp }}/pact-native-evidence/${{ matrix.key }}/native-summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Build Dev or Stable-candidate installers
        id: distribution
        if: ${{ !cancelled() && steps.native.outcome == 'success' && matrix.package && (vars.PACT_PACKAGING_READY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.validate_installers == true)) }}
        working-directory: source
        run: >-
          node scripts/build-distribution.mjs --channel "$CHANNEL"
          --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH"
          --sha "$CANDIDATE_SHA" --build-number "$GITHUB_RUN_NUMBER"
          --output "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY"
        env:
          CHANNEL: ${{ needs.identity.outputs.channel }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          PLATFORM_KEY: ${{ matrix.key }}
          CANDIDATE_SHA: ${{ needs.identity.outputs.candidate }}
      - name: Record deferred installers without waiving native checks
        if: ${{ !cancelled() && (!matrix.package || (vars.PACT_PACKAGING_READY != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.validate_installers == true))) }}
        run: >-
          node --input-type=module -e
          'import { appendFile } from "node:fs/promises";
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
          "Installer validation is not selected. Enable the packaging switch after native acceptance or dispatch validate_installers for a no-credential preflight. Native protocol checks remain required; Stable candidates also require complete E2E.\n");'
      - name: Install and cold-start the exact NSIS or DMG application
        id: package-smoke
        if: ${{ !cancelled() && steps.distribution.outcome == 'success' }}
        working-directory: source
        run: >-
          node scripts/package-smoke.mjs --production-paths
          --manifest "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY/distribution-manifest.json"
          --report "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY/package-smoke-report.json"
        env:
          PLATFORM_KEY: ${{ matrix.key }}
      - name: Extract and validate the exact macOS ZIP
        id: zip-smoke
        if: ${{ !cancelled() && matrix.platform == 'darwin' && steps.package-smoke.outcome == 'success' }}
        working-directory: source
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { join } from "node:path";
            import { spawnSync } from "node:child_process";
            const root = join(process.env.RUNNER_TEMP, "pact-distribution", process.env.PLATFORM_KEY);
            const manifest = join(root, "distribution-manifest.json");
            const zip = JSON.parse(await readFile(manifest, "utf8")).artifacts.find(a => a.kind === "zip");
            if (!zip) throw Error("ZIP is required");
            const result = spawnSync(process.execPath, ["scripts/package-smoke.mjs", "--production-paths", "--manifest", manifest, "--artifact", join(root, zip.path), "--report", join(root, "package-zip-smoke-report.json")], {shell:false, stdio:"inherit"});
            if (result.error) throw result.error;
            process.exit(result.status ?? 1);
          '
        env:
          PLATFORM_KEY: ${{ matrix.key }}
      - name: Validate the separate Stable identity during manual installer preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_installers == true && steps.package-smoke.outcome == 'success' }}
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const output = join(process.env.RUNNER_TEMP, 'pact-distribution', process.env.PLATFORM_KEY, 'stable-preflight');
          const manifest = join(output, 'distribution-manifest.json');
          const invoke = (args) => {
            const result = spawnSync(process.execPath, args, { shell: false, stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) throw Error('Stable installer preflight failed');
          };
          invoke(['scripts/build-distribution.mjs', '--channel', 'stable', '--platform', process.env.TARGET_PLATFORM, '--arch', process.env.TARGET_ARCH, '--sha', process.env.CANDIDATE_SHA, '--build-number', process.env.GITHUB_RUN_NUMBER, '--output', output]);
          const distribution = JSON.parse(await readFile(manifest, 'utf8'));
          if (distribution.sourceDirty !== false) throw Error('Stable preflight requires a clean source checkout');
          invoke(['scripts/package-smoke.mjs', '--manifest', manifest, '--production-paths', '--report', join(output, 'package-smoke-report.json')]);
          if (process.env.TARGET_PLATFORM === 'darwin') {
            const zip = distribution.artifacts.find((item) => item.kind === 'zip');
            if (!zip) throw Error('Stable ZIP is required');
            invoke(['scripts/package-smoke.mjs', '--manifest', manifest, '--production-paths', '--artifact', join(output, zip.path), '--report', join(output, 'package-zip-smoke-report.json')]);
          }
          NODE
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          CANDIDATE_SHA: ${{ needs.identity.outputs.candidate }}
      - name: Revalidate current head and base after physical cleanup
        run: node control/scripts/ci-identity.mjs verify "$RUNNER_TEMP/pact-identity/ci-identity.json"
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve installers and bounded fixture-only verification records
        if: ${{ always() && matrix.package && (vars.PACT_PACKAGING_READY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.validate_installers == true)) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.identity.outputs.channel }}-${{ matrix.key }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.exe
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.dmg
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.zip
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.json
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/SHA256SUMS
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/stable-preflight/*.exe
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/stable-preflight/*.dmg
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/stable-preflight/*.zip
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/stable-preflight/*.json
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/stable-preflight/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  provider:
    name: Real model tests
    needs: [identity, publication, quality, platform, candidate-attestation]
    if: github.repository_id == '1416403312' && ((github.event_name == 'pull_request_target' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == vars.PACT_CI_BOOTSTRAP_REF && github.sha == vars.PACT_CI_BOOTSTRAP_HEAD && vars.PACT_CI_BOOTSTRAP_PR != ''))
    # The local reusable workflow is loaded from this root workflow's trusted
    # source commit. Only its named environment supplies model credentials.
    uses: ./.github/workflows/provider-e2e.yml
    # Environment-only secrets still need an explicit reusable-workflow contract.
    # Forward only model configuration; control-plane/App secrets stay outside it.
    secrets:
      PACT_CLAUDE_SETTINGS_JSON: ${{ secrets.PACT_CLAUDE_SETTINGS_JSON }}
      PACT_CODEX_CONFIG_TOML: ${{ secrets.PACT_CODEX_CONFIG_TOML }}
      PACT_CODEX_AUTH_JSON: ${{ secrets.PACT_CODEX_AUTH_JSON }}
      PACT_CODEX_PROVIDER_ENV_JSON: ${{ secrets.PACT_CODEX_PROVIDER_ENV_JSON }}
    with:
      controller: ${{ needs.identity.outputs.controller }}
      source_kind: ${{ needs.identity.outputs.source_kind }}
      suite: ${{ contains(github.event.pull_request.labels.*.name, 'pact:real-full') && 'full' || 'core' }}
      extended_e2e: ${{ needs.identity.outputs.channel == 'stable' || inputs.extended_e2e == true }}
      root_run_id: ${{ github.run_id }}
      root_attempt: ${{ github.run_attempt }}

  check-writer:
    name: Publish PR check results
    needs: [identity, publication, quality, platform, candidate-attestation, provider]
    if: always() && (github.repository_id == '1416403312' && ((github.event_name == 'pull_request_target' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == vars.PACT_CI_BOOTSTRAP_REF && github.sha == vars.PACT_CI_BOOTSTRAP_HEAD && vars.PACT_CI_BOOTSTRAP_PR != '')))
    environment: ${{ github.event_name == 'pull_request_target' && 'pact-control-plane' || 'pact-bootstrap-control-plane' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Only controller scripts execute here; candidate hooks/dependencies and
      # Provider secrets remain in their separate jobs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-identity-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/pact-identity
      - id: app
        name: Mint repository-scoped read-source/read-PR/read-Actions/write-Checks identity
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PACT_CI_APP_ID }}
          private-key: ${{ secrets.PACT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Pact
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-checks: write
      - name: Publish fixed-App results for this current root execution attempt
        run: >-
          node scripts/ci-control.mjs publish
          --identity "$RUNNER_TEMP/pact-identity/ci-identity.json" --run "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PACT_CI_APP_ID: ${{ secrets.PACT_CI_APP_ID }}
          PACT_PROVIDER_ALLOWED: ${{ needs.provider.outputs.allowed }}

  pact-complete:
    name: Trusted PR gate
    needs: [identity, publication, quality, platform, candidate-attestation, provider, check-writer]
    if: always() && (github.repository_id == '1416403312' && ((github.event_name == 'pull_request_target' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == vars.PACT_CI_BOOTSTRAP_REF && github.sha == vars.PACT_CI_BOOTSTRAP_HEAD && vars.PACT_CI_BOOTSTRAP_PR != '')))
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-identity-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/pact-identity
      - name: Require every current dependency and fixed-App result to pass
        run: >-
          node scripts/ci-control.mjs complete
          --identity "$RUNNER_TEMP/pact-identity/ci-identity.json" --run "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          PACT_CI_APP_ID: ${{ vars.PACT_CI_APP_ID }}
          PACT_PROVIDER_ALLOWED: ${{ needs.provider.outputs.allowed }}

  branch-complete:
    name: Branch checks complete
    needs: [identity, publication, quality, platform]
    if: always() && !(github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref == vars.PACT_CI_BOOTSTRAP_REF && github.sha == vars.PACT_CI_BOOTSTRAP_HEAD && vars.PACT_CI_BOOTSTRAP_PR != ''))
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Require all no-credential branch checks and target architectures to pass
        run: >-
          node --input-type=module -e
          'for (const name of ["IDENTITY_RESULT","PUBLICATION_RESULT","QUALITY_RESULT","PLATFORM_RESULT"])
          if (process.env[name] !== "success") throw Error(`${name} did not pass`);'
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
