name: CI

on:
  push:
    branches: ['**']
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

# The base workflow alone controls PR jobs. Candidate execution has read-only
# permissions and no environment, App, or provider credentials.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pact-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      head: ${{ steps.identity.outputs.head }}
      base: ${{ steps.identity.outputs.base }}
      channel: ${{ steps.identity.outputs.channel }}
      controller: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - id: identity
        name: Capture current head, base and actual two-parent merge candidate
        run: node scripts/ci-identity.mjs capture-api "$RUNNER_TEMP/ci-identity.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACT_CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          PACT_CI_CONTROL_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          PACT_CI_PUSH_SHA: ${{ github.sha }}
          PACT_RELEASE_APP_BOT_ID: ${{ vars.PACT_RELEASE_APP_BOT_ID }}
          PACT_RELEASE_APP_SLUG: ${{ vars.PACT_RELEASE_APP_SLUG }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-identity
          path: ${{ runner.temp }}/ci-identity.json
          if-no-files-found: error
          retention-days: 14

  publication:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: control/.node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
          run_install: false
      - name: Install only pinned controller dependencies without candidate execution
        working-directory: control
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./control/.github/actions/gitleaks
      - name: Review publication and all reachable source history
        working-directory: source
        run: |
          node ../control/scripts/check-publication.mjs
          node ../control/scripts/check-secrets.mjs --history
          node ../control/scripts/check-e2e-coverage.mjs --source-only --json
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source

  candidate-attestation:
    needs: identity
    if: github.event_name == 'pull_request_target'
    environment: pact-control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No candidate files or candidate dependencies enter this privileged job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-identity
          path: ${{ runner.temp }}/pact-identity
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PACT_CI_APP_ID }}
          private-key: ${{ secrets.PACT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Pact
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: write
      - name: Bind trusted job outputs to a fixed-App candidate receipt
        run: >-
          node scripts/ci-control.mjs attest
          --identity "$RUNNER_TEMP/pact-identity/ci-identity.json" --run "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PACT_CI_APP_ID: ${{ secrets.PACT_CI_APP_ID }}
          PACT_CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          PACT_CI_HEAD_SHA: ${{ needs.identity.outputs.head }}
          PACT_CI_BASE_SHA: ${{ needs.identity.outputs.base }}
          PACT_CI_CANDIDATE_SHA: ${{ needs.identity.outputs.candidate }}
          PACT_CI_CHANNEL: ${{ needs.identity.outputs.channel }}

  quality:
    needs: [identity, publication]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          path: source
          persist-credentials: false
      - uses: ./control/.github/actions/setup
        with:
          workspace: source
          controller: control
      - uses: ./control/.github/actions/gitleaks
      - name: All static checks, product/test types and unit cases
        run: node control/scripts/ci.mjs quality
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
      - name: Every independent script test
        run: node control/scripts/ci.mjs infra
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
      - name: Build and immutable source assertion obligations
        working-directory: source
        run: |
          node ../control/scripts/ci.mjs build
          node ../control/scripts/check-e2e-coverage.mjs --json
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source

  platform:
    name: platform-${{ matrix.key }}
    needs: [identity, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            key: darwin-arm64
          - runner: windows-2025
            platform: win32
            arch: x64
            key: win32-x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            key: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.controller }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          path: source
          persist-credentials: false
      - uses: ./control/.github/actions/setup
        with:
          workspace: source
          controller: control
          native: 'true'
          display: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-identity
          path: ${{ runner.temp }}/pact-identity
      - name: Verify target architecture and exact tested workspace
        run: |
          node --input-type=module -e 'if(process.platform!==process.env.TARGET_PLATFORM||process.arch!==process.env.TARGET_ARCH)throw Error("Runner architecture mismatch")'
          node control/scripts/ci-identity.mjs verify "$RUNNER_TEMP/pact-identity/ci-identity.json"
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          GITHUB_TOKEN: ${{ github.token }}
      - name: Rebuild desktop native dependencies for this architecture
        run: node control/scripts/ci.mjs build
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
      - name: Electron UI
        run: node control/scripts/ci.mjs ui
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          PACT_CI_EVIDENCE_DIR: ${{ runner.temp }}/pact-evidence/${{ matrix.key }}
      - name: Deterministic Electron business and lifecycle journeys
        run: node control/scripts/ci.mjs deterministic
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          PACT_CI_EVIDENCE_DIR: ${{ runner.temp }}/pact-evidence/${{ matrix.key }}
      - name: Collect bounded no-credential Electron failure diagnostics
        if: failure()
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/pact-ui-diagnostics"
          node control/scripts/ci-ui-diagnostics.mjs --source "$GITHUB_WORKSPACE/source/test-results" --output "$RUNNER_TEMP/pact-ui-diagnostics/$PLATFORM_KEY"
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          PACT_CI_DIAGNOSTIC_LANE: uncredentialed
      - name: Preserve only collected no-credential UI context and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-diagnostics-${{ matrix.key }}
          path: ${{ runner.temp }}/pact-ui-diagnostics/${{ matrix.key }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve actual uncredentialed test results for the full immutable result gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.key }}
          path: ${{ runner.temp }}/pact-evidence/${{ matrix.key }}/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Actual native CLI protocol, configuration and cold-history regression
        run: node control/scripts/ci.mjs native
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
      - name: Build Dev or Stable-candidate installers
        working-directory: source
        run: >-
          node scripts/build-distribution.mjs --channel "$CHANNEL"
          --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH"
          --sha "$CANDIDATE_SHA" --build-number "$GITHUB_RUN_NUMBER"
          --output "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY"
        env:
          CHANNEL: ${{ needs.identity.outputs.channel }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          PLATFORM_KEY: ${{ matrix.key }}
          CANDIDATE_SHA: ${{ needs.identity.outputs.candidate }}
      - name: Install and cold-start the exact NSIS or DMG application
        working-directory: source
        run: >-
          node scripts/package-smoke.mjs --production-paths
          --manifest "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY/distribution-manifest.json"
          --report "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY/package-smoke-report.json"
        env:
          PLATFORM_KEY: ${{ matrix.key }}
      - name: Extract and validate the exact macOS ZIP
        if: matrix.platform == 'darwin'
        working-directory: source
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { join } from "node:path";
            import { spawnSync } from "node:child_process";
            const root = join(process.env.RUNNER_TEMP, "pact-distribution", process.env.PLATFORM_KEY);
            const manifest = join(root, "distribution-manifest.json");
            const zip = JSON.parse(await readFile(manifest, "utf8")).artifacts.find(a => a.kind === "zip");
            if (!zip) throw Error("ZIP is required");
            const result = spawnSync(process.execPath, ["scripts/package-smoke.mjs", "--production-paths", "--manifest", manifest, "--artifact", join(root, zip.path), "--report", join(root, "package-zip-smoke-report.json")], {shell:false, stdio:"inherit"});
            if (result.error) throw result.error;
            process.exit(result.status ?? 1);
          '
        env:
          PLATFORM_KEY: ${{ matrix.key }}
      - name: Continuous deterministic resource soak on installed content
        working-directory: source
        run: >-
          node scripts/run-soak.mjs
          --manifest "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY/distribution-manifest.json"
          --duration-ms "$SOAK_DURATION"
          --report "$RUNNER_TEMP/pact-distribution/$PLATFORM_KEY/package-soak-report.json"
        env:
          PLATFORM_KEY: ${{ matrix.key }}
          SOAK_DURATION: ${{ needs.identity.outputs.channel == 'stable' && '7200000' || '3600000' }}
      - name: Revalidate current head and base after physical cleanup
        run: node control/scripts/ci-identity.mjs verify "$RUNNER_TEMP/pact-identity/ci-identity.json"
        env:
          PACT_CI_WORKSPACE: ${{ github.workspace }}/source
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve installers and bounded fixture-only verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.identity.outputs.channel }}-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.exe
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.dmg
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.zip
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/*.json
            ${{ runner.temp }}/pact-distribution/${{ matrix.key }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
