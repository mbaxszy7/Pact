name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pact-gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/pact-gitleaks" gitleaks
          echo "$RUNNER_TEMP/pact-gitleaks" >> "$GITHUB_PATH"
      - run: node scripts/check-publication.mjs
      - run: node scripts/check-secrets.mjs --history
      - run: node --test scripts/check-publication.test.mjs scripts/check-secrets.test.mjs scripts/e2e-baseline.test.mjs

  quality:
    needs: publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node --test scripts/check-e2e-coverage.test.mjs
      - run: node scripts/check-e2e-coverage.mjs --json

  package-smoke:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:infra
      - run: pnpm test:e2e:ui
      - run: pnpm test:e2e:deterministic
      - run: pnpm verify:package

  native-runtime:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Native CLIs in an isolated test directory
        run: |
          mkdir -p "$RUNNER_TEMP/pact-native-cli"
          pnpm --dir "$RUNNER_TEMP/pact-native-cli" add @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.272
      - name: Native protocol/configuration/history checks without paid providers
        run: pnpm test:native
        env:
          PACT_NATIVE_CODEX_EXECUTABLE: ${{ runner.temp }}/pact-native-cli/node_modules/.bin/codex
          PACT_NATIVE_CLAUDE_EXECUTABLE: ${{ runner.temp }}/pact-native-cli/node_modules/.bin/claude
