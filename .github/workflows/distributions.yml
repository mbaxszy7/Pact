name: Pact distributions and acceptance

on:
  workflow_call:
    secrets:
      PACT_CLAUDE_SETTINGS_JSON:
        required: true
      PACT_CODEX_CONFIG_TOML:
        required: true
      PACT_CODEX_AUTH_JSON:
        required: true
      PACT_CODEX_PROVIDER_ENV_JSON:
        required: false
    inputs:
      source_sha:
        description: Exact event commit tested and packaged by every job
        required: true
        type: string
      channel:
        description: dev or stable application identity
        required: true
        type: string
      real_allowed:
        description: Only this repository's maintained source may use model credentials
        required: true
        type: boolean
    outputs:
      package_mac_id:
        value: ${{ jobs.package_mac.outputs.id }}
      package_mac_digest:
        value: ${{ jobs.package_mac.outputs.digest }}
      package_win_id:
        value: ${{ jobs.package_win.outputs.id }}
      package_win_digest:
        value: ${{ jobs.package_win.outputs.digest }}
      package_win_arm64_id:
        value: ${{ jobs.package_win_arm64.outputs.id }}
      package_win_arm64_digest:
        value: ${{ jobs.package_win_arm64.outputs.digest }}
      smoke_mac_id:
        value: ${{ jobs.smoke_mac.outputs.id }}
      smoke_mac_digest:
        value: ${{ jobs.smoke_mac.outputs.digest }}
      smoke_win_id:
        value: ${{ jobs.smoke_win.outputs.id }}
      smoke_win_digest:
        value: ${{ jobs.smoke_win.outputs.digest }}
      smoke_win_arm64_id:
        value: ${{ jobs.smoke_win_arm64.outputs.id }}
      smoke_win_arm64_digest:
        value: ${{ jobs.smoke_win_arm64.outputs.digest }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PACT_CI_CHANNEL: ${{ inputs.channel }}

jobs:
  quality:
    name: Quality, types and unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/gitleaks
      - name: Review source history and immutable assertion obligations
        run: |
          node scripts/check-secrets.mjs --history
          node scripts/check-e2e-coverage.mjs --source-only --json
      - name: Static checks, all product and test types, and unit tests
        run: node scripts/ci.mjs quality
      - name: Independent script tests
        run: node scripts/ci.mjs infra
        env:
          PACT_CI_EVIDENCE_DIR: ${{ runner.temp }}/pact-quality-evidence
      - name: Build and discover every immutable E2E assertion obligation
        run: |
          node scripts/ci.mjs build
          node scripts/check-e2e-coverage.mjs --json
      - name: Preserve bounded script supervision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-process-evidence-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/pact-quality-evidence/infra-supervision.json
          if-no-files-found: ignore
          retention-days: 14

  native_mac:
    name: Native protocol - macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          native: 'true'
      - name: Verify native runner and record the exact source/run
        run: |
          node --input-type=module -e 'if(process.platform!=="darwin"||process.arch!=="arm64")throw Error("Runner architecture mismatch")'
          node scripts/e2e-report.mjs --ci-metadata "$RUNNER_TEMP/e2e-metadata.json"
      - name: Build native runtime dependencies
        run: node scripts/ci.mjs build
      - name: Actual native CLI protocol, configuration and lifecycle cases
        run: node scripts/ci.mjs native
        env:
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-evidence/darwin-arm64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-e2e-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Prepare the separate pinned Codex decision protocol profile
        run: node scripts/ci-native.mjs decision-codex
      - name: Actual Codex decision protocol and physical lifecycle cases
        run: node scripts/ci.mjs native decision-codex
        env:
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-decision-evidence/darwin-arm64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-decision-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Prepare the separate pinned Claude decision protocol profile
        run: node scripts/ci-native.mjs decision-claude
      - name: Actual Claude decision protocol and production response guard cases
        run: node scripts/ci.mjs native decision-claude
        env:
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-claude-decision-evidence/darwin-arm64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-claude-decision-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Preserve sanitized native case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-e2e-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-native-evidence/darwin-arm64/native-summary.json
            ${{ runner.temp }}/pact-native-evidence/darwin-arm64/native-summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve sanitized decision native case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-decision-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-native-decision-evidence/darwin-arm64/native-summary.json
            ${{ runner.temp }}/pact-native-decision-evidence/darwin-arm64/native-summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve unavailable claude-decision execution as blocked evidence
        if: always()
        run: node scripts/ci-native-report.mjs
        env:
          PACT_CI_NATIVE_PROFILE: decision-claude
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-claude-decision-evidence/darwin-arm64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-claude-decision-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Preserve sanitized claude-decision case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-claude-decision-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-native-claude-decision-evidence/darwin-arm64/native-summary.json
            ${{ runner.temp }}/pact-native-claude-decision-evidence/darwin-arm64/native-summary.md
          if-no-files-found: ignore
          retention-days: 14

  package_mac:
    name: Package - macOS arm64
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      PACT_CI_PLATFORM: darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the exact native installer candidate
        run: >-
          node scripts/build-distribution.mjs --channel "$PACT_CI_CHANNEL"
          --platform darwin --arch arm64 --sha "$SOURCE_SHA"
          --build-number "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/package"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
      - name: Bind the clean installer manifest to its producing execution
        run: node scripts/ci-artifacts.mjs package-context "$RUNNER_TEMP/package"
      - id: upload
        name: Preserve the immutable native package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/package/*.exe
            ${{ runner.temp }}/package/*.dmg
            ${{ runner.temp }}/package/*.zip
            ${{ runner.temp }}/package/distribution-manifest.json
            ${{ runner.temp }}/package/execution-context.json
            ${{ runner.temp }}/package/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  smoke_mac:
    name: Installed smoke - macOS arm64
    needs: package_mac
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      PACT_CI_PLATFORM: darwin-arm64
      PACKAGE_ID: ${{ needs.package_mac.outputs.id }}
      PACKAGE_DIGEST: ${{ needs.package_mac.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          display: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package_mac.outputs.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/package
      - name: Install, cold-start, restart and clean the exact downloaded installers
        run: >-
          node scripts/ci-artifacts.mjs smoke "$RUNNER_TEMP/package"
          "$RUNNER_TEMP/smoke" "$PACKAGE_ID" "$PACKAGE_DIGEST"
      - id: upload
        name: Preserve actual installed-byte and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke/*.json
          if-no-files-found: error
          retention-days: 14

  real_mac:
    name: Real core E2E - macOS arm64
    needs: [quality, native_mac]
    if: inputs.real_allowed
    environment: pact-provider-ci
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          native: 'true'
          display: 'true'
      - name: Verify native runner and record the exact source/run
        run: |
          node --input-type=module -e 'if(process.platform!=="darwin"||process.arch!=="arm64")throw Error("Runner architecture mismatch")'
          node scripts/e2e-report.mjs --ci-metadata "$RUNNER_TEMP/e2e-metadata.json"
      - name: Execute existing real core cases with isolated model configuration
        id: execute
        continue-on-error: true
        run: node scripts/ci.mjs real core
        env:
          PACT_CI_EVIDENCE_DIR: ${{ runner.temp }}/pact-evidence/darwin-arm64
          PACT_CLAUDE_SETTINGS_JSON: ${{ secrets.PACT_CLAUDE_SETTINGS_JSON }}
          PACT_CODEX_CONFIG_TOML: ${{ secrets.PACT_CODEX_CONFIG_TOML }}
          PACT_CODEX_AUTH_JSON: ${{ secrets.PACT_CODEX_AUTH_JSON }}
          PACT_CODEX_PROVIDER_ENV_JSON: ${{ secrets.PACT_CODEX_PROVIDER_ENV_JSON }}
      - name: Require real execution and every applicable core case
        if: always()
        run: >-
          node scripts/real-e2e-policy.mjs core core
          "$RUNNER_TEMP/pact-evidence/darwin-arm64" "$RUNNER_TEMP/e2e-metadata.json"
        env:
          PACT_REAL_EXECUTION_COMPLETED: ${{ steps.execute.outputs.real_execution_completed }}
          PACT_REAL_REPORT_ARTIFACT: real-e2e-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Preserve only sanitized core and deferred-case reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-e2e-darwin-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-evidence/darwin-arm64/real-summary.json
            ${{ runner.temp }}/pact-evidence/darwin-arm64/real-summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Remove private provider output
        if: always()
        run: >-
          node --input-type=module -e
          'import {rm} from "node:fs/promises";import {join} from "node:path";
          await rm(join(process.env.RUNNER_TEMP,"pact-evidence","darwin-arm64","real.json"),{force:true});'

  native_win:
    name: Native protocol - Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prepare the matching installed Windows SDK and MSVC tools
        shell: pwsh
        timeout-minutes: 2
        env:
          PACT_MSVC_ARCH: x64
        run: &windows-msvc-environment |
          $ErrorActionPreference = 'Stop'
          $arch = $env:PACT_MSVC_ARCH
          if ($arch -notin @('x64', 'arm64')) { throw 'Unsupported native MSVC target.' }
          node --input-type=module -e 'if(process.platform!=="win32"||process.arch!==process.env.PACT_MSVC_ARCH)throw Error("Native MSVC runner architecture mismatch")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $component = if ($arch -eq 'arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'The installed Visual Studio locator is unavailable.' }
          $installation = @(& $vswhere -latest -products '*' -requires $component -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installation.Count -ne 1 -or $installation[0].Length -gt 4096 -or $installation[0] -match '[\x00\r\n"]') { throw 'The required installed MSVC component could not be located.' }
          $devCmd = Join-Path ($installation[0].Trim()) 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) { throw 'The installed Visual Studio developer command is unavailable.' }
          $command = 'call "{0}" -no_logo -arch={1} -host_arch={1} >nul && set PATH && set INCLUDE && set LIB && set LIBPATH && set VSCMD_ARG_TGT_ARCH' -f $devCmd, $arch
          $lines = @(& $env:ComSpec /d /s /c $command)
          if ($LASTEXITCODE -ne 0) { throw 'The matching native MSVC environment could not be initialized.' }
          if ($lines.Count -gt 128 -or [Text.Encoding]::UTF8.GetByteCount(($lines -join "`n")) -gt 65536) { throw 'The MSVC environment exceeded its admission bound.' }
          $selected = @{}
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VSCMD_ARG_TGT_ARCH)=(.*)$') { $selected[$Matches[1].ToUpperInvariant()] = $Matches[2] }
          }
          foreach ($key in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSCMD_ARG_TGT_ARCH')) {
            if (-not $selected.ContainsKey($key) -or [string]::IsNullOrWhiteSpace($selected[$key]) -or $selected[$key] -match '[\x00\r\n]') { throw 'A required MSVC environment field is missing or invalid.' }
          }
          if ($selected['VSCMD_ARG_TGT_ARCH'] -ne $arch) { throw 'MSVC selected a different target architecture.' }
          $env:PATH = $selected['PATH']
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if (-not $compiler.EndsWith("\Host$arch\$arch\cl.exe", [StringComparison]::OrdinalIgnoreCase)) { throw 'MSVC selected a different compiler host or target.' }
          $compilerDirectory = Split-Path -Parent $compiler
          if (-not (Test-Path -LiteralPath (Join-Path $compilerDirectory 'link.exe') -PathType Leaf)) { throw 'The matching MSVC linker is unavailable.' }
          foreach ($key in @('INCLUDE', 'LIB', 'LIBPATH', 'VSCMD_ARG_TGT_ARCH')) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value ("{0}={1}" -f $key, $selected[$key])
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Value $compilerDirectory
      - uses: ./.github/actions/setup
        with:
          native: 'true'
      - name: Verify native runner and record the exact source/run
        run: |
          node --input-type=module -e 'if(process.platform!=="win32"||process.arch!=="x64")throw Error("Runner architecture mismatch")'
          node scripts/e2e-report.mjs --ci-metadata "$RUNNER_TEMP/e2e-metadata.json"
      - name: Build native runtime dependencies
        run: node scripts/ci.mjs build
      - name: Actual Windows product helper ownership and physical lifecycle cases
        run: node scripts/ci.mjs native windows-owner
        env:
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-windows-owner-evidence/win32-x64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-windows-owner-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Actual native CLI protocol, configuration and lifecycle cases
        run: node scripts/ci.mjs native
        env:
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-evidence/win32-x64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-e2e-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Verify decision isolation remains unavailable on Windows
        run: >-
          node --input-type=module -e
          "import { nativeProfile, nativeProfileSupports } from './scripts/native-profiles.mjs';
          for (const name of ['decision-codex', 'decision-claude'])
          if (nativeProfileSupports(nativeProfile(name))) throw new Error('Unsafe decision platform admission');"
      - name: Preserve sanitized native case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-e2e-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-native-evidence/win32-x64/native-summary.json
            ${{ runner.temp }}/pact-native-evidence/win32-x64/native-summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve unavailable windows-owner execution as blocked evidence
        if: always()
        run: node scripts/ci-native-report.mjs
        env:
          PACT_CI_NATIVE_PROFILE: windows-owner
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-windows-owner-evidence/win32-x64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-windows-owner-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Preserve sanitized windows-owner case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-owner-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-native-windows-owner-evidence/win32-x64/native-summary.json
            ${{ runner.temp }}/pact-native-windows-owner-evidence/win32-x64/native-summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve unavailable claude-decision execution as blocked evidence
        if: always()
        run: node scripts/ci-native-report.mjs
        env:
          PACT_CI_NATIVE_PROFILE: decision-claude
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-claude-decision-evidence/win32-x64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-claude-decision-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Preserve sanitized claude-decision case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-claude-decision-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pact-native-claude-decision-evidence/win32-x64/native-summary.json
            ${{ runner.temp }}/pact-native-claude-decision-evidence/win32-x64/native-summary.md
          if-no-files-found: ignore
          retention-days: 14

  package_win:
    name: Package - Windows x64
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      PACT_CI_PLATFORM: win32-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Prepare the matching installed Windows SDK and MSVC tools
        shell: pwsh
        timeout-minutes: 2
        env:
          PACT_MSVC_ARCH: x64
        run: *windows-msvc-environment
      - uses: ./.github/actions/setup
      - name: Build the exact native installer candidate
        run: >-
          node scripts/build-distribution.mjs --channel "$PACT_CI_CHANNEL"
          --platform win32 --arch x64 --sha "$SOURCE_SHA"
          --build-number "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/package"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
      - name: Bind the clean installer manifest to its producing execution
        run: node scripts/ci-artifacts.mjs package-context "$RUNNER_TEMP/package"
      - id: upload
        name: Preserve the immutable native package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/package/*.exe
            ${{ runner.temp }}/package/*.dmg
            ${{ runner.temp }}/package/*.zip
            ${{ runner.temp }}/package/distribution-manifest.json
            ${{ runner.temp }}/package/execution-context.json
            ${{ runner.temp }}/package/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  smoke_win:
    name: Installed smoke - Windows x64
    needs: package_win
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      PACT_CI_PLATFORM: win32-x64
      PACKAGE_ID: ${{ needs.package_win.outputs.id }}
      PACKAGE_DIGEST: ${{ needs.package_win.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          display: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package_win.outputs.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/package
      - name: Install, cold-start, restart and clean the exact downloaded installers
        run: >-
