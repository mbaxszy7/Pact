        env:
          PACT_REAL_EXECUTION_COMPLETED: ${{ steps.execute.outputs.real_execution_completed }}
          PACT_REAL_REPORT_ARTIFACT: real-e2e-win32-x64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Preserve only sanitized core and deferred-case reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
