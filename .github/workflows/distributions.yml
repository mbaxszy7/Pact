    steps:
      - name: Require native Windows ARM64 before setup
        shell: pwsh
        run: |
          node --input-type=module -e 'if(process.platform!=="win32"||process.arch!=="arm64")throw Error("Runner architecture mismatch")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
