            ${{ runner.temp }}/pact-native-evidence/win32-arm64/native-summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve unavailable windows-owner execution as blocked evidence
        if: always()
        run: node scripts/ci-native-report.mjs
        env:
          PACT_CI_NATIVE_PROFILE: windows-owner
          PACT_CI_NATIVE_REPORT_DIR: ${{ runner.temp }}/pact-native-windows-owner-evidence/win32-arm64
          PACT_CI_NATIVE_IDENTITY_FILE: ${{ runner.temp }}/e2e-metadata.json
          PACT_CI_NATIVE_ARTIFACT: native-windows-owner-win32-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
      - name: Preserve sanitized windows-owner case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-owner-win32-arm64-${{ inputs.channel }}-a${{ github.run_attempt }}
