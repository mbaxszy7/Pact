  publication:
    needs:
      [
        identity,
        quality,
        build-darwin-arm64,
        build-win32-x64,
        build-win32-arm64,
        stage-darwin-arm64,
        stage-win32-x64,
        stage-win32-arm64,
      ]
    if: >-
      always() && needs.identity.result == 'success' &&
      needs.identity.outputs.applicable == 'true' && needs.identity.outputs.published == 'false' &&
      needs.quality.result == 'success' &&
      (needs.identity.outputs.ready_darwin_arm64 == 'true' || needs.stage-darwin-arm64.result == 'success') &&
      (needs.identity.outputs.ready_win32_x64 == 'true' || needs.stage-win32-x64.result == 'success') &&
      (needs.identity.outputs.ready_win32_arm64 == 'true' || needs.stage-win32-arm64.result == 'success')
    environment: pact-control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PACT_EXPECTED_VERSION: ${{ needs.identity.outputs.version }}
      PACT_EXPECTED_SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
      PACT_EXPECTED_RELEASE_ID: ${{ needs.identity.outputs.release_id }}
    concurrency:
      group: pact-stable-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.control_sha }}
