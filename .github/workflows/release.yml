        with:
          name: release-identity
          path: ${{ runner.temp }}/pact-identity
      - id: app
        name: Mint short-lived content-only publication token after platform work
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PACT_CI_APP_ID }}
          private-key: ${{ secrets.PACT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Pact
          permission-contents: write
          permission-pull-requests: read
      - name: Reconcile exact uploaded bytes and publish only the complete verified release
        run: >-
          node scripts/release-control.mjs publish
          --identity "$RUNNER_TEMP/pact-identity/release-identity.json"
          --artifacts "$RUNNER_TEMP/pact-final"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACT_RELEASE_APP_BOT_ID: ${{ vars.PACT_RELEASE_APP_BOT_ID }}
          PACT_RELEASE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PACT_RELEASE_SIGNING_KEY: ${{ secrets.PACT_CI_APP_PRIVATE_KEY }}
          PACT_GOVERNANCE_READY: ${{ vars.PACT_GOVERNANCE_READY }}
          PACT_APPROVED_MAJOR_VERSION: ${{ vars.PACT_APPROVED_MAJOR_VERSION }}
